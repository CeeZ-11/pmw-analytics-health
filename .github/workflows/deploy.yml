name: Deploy to GitHub Pages

# Builds the static dashboard and publishes it to GitHub Pages.
#
# Setup (once): repo Settings → Pages → Source: "GitHub Actions".
# Data source: repo Settings → Secrets and variables → Actions → *Variables*:
#   VITE_DATA_SOURCE   = mock | api        (default: mock)
#   VITE_API_BASE_URL  = https://<n8n-host>/webhook/pmw-analytics-health
# These are Variables, not Secrets, on purpose: they are compiled into the
# public JS bundle. Never put a credential in them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE || 'mock' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_TIMEOUT_MS: ${{ vars.VITE_API_TIMEOUT_MS || '15000' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
